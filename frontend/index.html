<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRUD de Productos</title>
  <style>
    body { font-family: system-ui; max-width: 760px; margin: 2rem auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: .5rem; text-align: left; }
    input { margin: .2rem; padding: .4rem; }
    button { padding: .4rem .8rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Productos</h1>

  <form id="form">
    <input id="nombre" placeholder="Nombre" required>
    <input id="precio" type="number" step="0.01" placeholder="Precio" required>
    <input id="stock" type="number" placeholder="Stock">
    <input id="categoria" placeholder="Categoria">
    <button type="submit">Agregar</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Categoría</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="cuerpo"></tbody>
  </table>

  <script>
    const API = "http://localhost:8000/products/";

    async function cargar() {
      const res = await fetch(API);
      const productos = await res.json();
      const cuerpo = document.getElementById("cuerpo");
      cuerpo.innerHTML = productos.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.nombre}</td>
          <td>${p.precio}</td>
          <td>${p.stock}</td>
          <td>${p.categoria ?? ""}</td>
          <td><button onclick="eliminar(${p.id})">Eliminar</button></td>
        </tr>
      `).join("");
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nuevo = {
        nombre: document.getElementById("nombre").value,
        precio: parseFloat(document.getElementById("precio").value),
        stock: parseInt(document.getElementById("stock").value || 0),
        categoria: document.getElementById("categoria").value || null,
      };
      await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(nuevo),
      });
      e.target.reset();
      cargar();
    });

    async function eliminar(id) {
      await fetch(API + id, { method: "DELETE" });
      cargar();
    }

    cargar();
  </script>
</body>
</html>
